name: reusable-ci

# Baseline checks for a caller repository: secret scan of the files and the
# full history (or the history after history-since), documentation check,
# Pages check, then the caller's own test command. Call it at a release
# tag's full commit sha:
#   uses: <owner>/ci-cd-library/.github/workflows/reusable-ci.yml@0123456789abcdef0123456789abcdef01234567 # vX.Y.Z
# A caller without scripts/check_docs.py and scripts/sensitive-paths.sh must
# set require-repo-scripts: false, or the job fails.
# Actions are pinned to a commit; the trailing comment is the release each sha
# was. Bump by resolving the tag again, never by writing a tag back.
on:
  workflow_call:
    inputs:
      test-command:
        description: Shell command run from the repository root after the checks, e.g. `just ci` or `pnpm test`. Empty skips it.
        type: string
        required: false
        default: ""
      pages-check:
        description: Fail while GitHub Pages is on (on a private repository its site is public).
        type: boolean
        required: false
        default: true
      pages-allowed:
        description: Only the owner sets this to true, for a website that publishes built files only, with an entry in docs/DECISIONS.md; an agent never sets it to make CI pass.
        type: boolean
        required: false
        default: false
      fetch-depth:
        description: Commits to fetch. 0 (all) is what the history scan needs; anything else scans only what was fetched.
        type: number
        required: false
        default: 0
      history-since:
        description: Full commit SHA. The history scan covers only commits reachable from HEAD and not from this one; the product's own scanner must keep covering the history before it. Needs the full history (fetch-depth 0, the default); a commit missing from the checkout fails the job. Empty (the default) scans the whole history. The current-files scan is never narrowed.
        type: string
        required: false
        default: ""
      python-version:
        description: Python for the test command, e.g. "3.12". Empty skips setup-python.
        type: string
        required: false
        default: ""
      node-version:
        description: Node for the test command, e.g. "22". Empty skips setup-node.
        type: string
        required: false
        default: ""
      node-cache:
        description: Package manager whose cache setup-node restores, e.g. npm. Needs node-version set and that package manager's lockfile in the repository. Empty caches nothing.
        type: string
        required: false
        default: ""
      rust-toolchain:
        description: Exact Rust version X.Y.Z installed with rustup, with rustfmt and clippy, and made the default, e.g. "1.85.0"; any other value is refused. Empty skips it.
        type: string
        required: false
        default: ""
      cargo-dir:
        description: Folder holding Cargo.lock and target/, e.g. backend. Caches ~/.cargo and its target/ under a key on the toolchain and its Cargo.lock. Empty skips the cache.
        type: string
        required: false
        default: ""
      postgres-image:
        description: Postgres service image with a full version tag, e.g. "postgres:16.4-alpine", on localhost:5432. Empty starts no service. The test command gets the service's user, password and database as CI_POSTGRES_USER, CI_POSTGRES_PASSWORD and CI_POSTGRES_DB, so a caller builds its connection URL without writing the password in its workflow.
        type: string
        required: false
        default: ""
      postgres-user:
        description: POSTGRES_USER of the Postgres service. A disposable test credential, not a secret.
        type: string
        required: false
        default: test
      postgres-password:
        description: POSTGRES_PASSWORD of the Postgres service. A disposable test credential, not a secret.
        type: string
        required: false
        default: test
      postgres-db:
        description: POSTGRES_DB of the Postgres service.
        type: string
        required: false
        default: test
      redis-image:
        description: Redis service image with a full version tag, e.g. "redis:7.4.1-alpine", on localhost:6379. Empty starts no service.
        type: string
        required: false
        default: ""
      timeout-minutes:
        description: Job timeout.
        type: number
        required: false
        default: 15
      require-repo-scripts:
        description: Fail when the repository lacks scripts/check_docs.py or scripts/sensitive-paths.sh. False skips a missing one with a log line.
        type: boolean
        required: false
        default: true
      concurrency-key:
        description: Appended to the concurrency group, so two calls from one caller workflow do not cancel each other.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Prefixed so it never equals the caller's own group: the same group with
    # cancel-in-progress in caller and called workflow cancels the run itself.
    # github.workflow is the caller's workflow name here.
    concurrency:
      group: reusable-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.concurrency-key }}
      cancel-in-progress: true
    # A service whose image is an empty string is not started (GitHub's
    # workflow syntax, jobs.<job_id>.services.<service_id>.image), so both
    # are off unless the caller names an image. The test command reaches
    # them on localhost once their health checks pass.
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
          POSTGRES_DB: ${{ inputs.postgres-db }}
        ports:
          - 5432:5432
        # No input in options: the runner hands options to docker create
        # unparsed, so a value there could add docker flags to a container
        # that starts before the secret scans. Docker runs the health
        # command with the container's shell, which reads POSTGRES_USER
        # from the service's own env.
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ${{ inputs.redis-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false
      # The library at the exact commit the caller's pinned sha names:
      # job.workflow_repository and job.workflow_sha name the reusable workflow
      # file that defines this job, not the caller's workflow.
      - name: Checkout ci-cd-library at the called ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-cd-library
          persist-credentials: false
      # Copied out and removed so the caller's tree stays clean: the secret
      # scan, git status and the test command see only the caller's files.
      - name: Stage library files outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-cd-library"
          cp .ci-cd-library/.gitleaks.toml "$RUNNER_TEMP/ci-cd-library/gitleaks.toml"
          rm -rf .ci-cd-library
      - name: Check scanner bypasses
        run: test ! -e .gitleaksignore
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$target"
          curl --proto '=https' --proto-redir '=https' -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$target/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$target/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$target/gitleaks.tar.gz" -C "$target" gitleaks
          printf '%s\n' "$target" >> "$GITHUB_PATH"
      # Before any caller script runs, and always with the library's config:
      # a caller's own .gitleaks.toml could weaken the rules it is scanned by.
      - name: Scan current files
        run: gitleaks dir . --redact --no-banner --ignore-gitleaks-allow --config "$RUNNER_TEMP/ci-cd-library/gitleaks.toml"
      # history-since narrows this scan only, to the commits after the named
      # one; the product's own scanner keeps covering the history before it.
      # The value is refused unless it is a full SHA that is an ancestor of
      # HEAD in a full (not shallow) checkout, so a shallow clone or a commit
      # from another history fails.
      - name: Scan full history
        shell: bash
        env:
          HISTORY_SINCE: ${{ inputs.history-since }}
        run: |
          set -euo pipefail
          if [ -z "$HISTORY_SINCE" ]; then
            gitleaks git . --redact --no-banner --ignore-gitleaks-allow --config "$RUNNER_TEMP/ci-cd-library/gitleaks.toml"
            exit 0
          fi
          if [[ ! "$HISTORY_SINCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "history-since must be a full 40-character lowercase commit SHA; a branch, a tag, a short SHA or any other value is refused." >&2
            exit 1
          fi
          # gitleaks itself fails open on a range it cannot resolve (an
          # unknown sha scans 0 commits and passes), so the two checks below
          # are the only guard. A shallow checkout is refused even when the
          # named commit was fetched: merged-in commits below its depth would
          # be left out silently.
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "history-since needs the full history, and this checkout is shallow: set fetch-depth 0." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HISTORY_SINCE" HEAD; then
            echo "history-since $HISTORY_SINCE is not an ancestor of HEAD in this checkout: a commit from another history, or one a shallow clone did not fetch (history-since needs fetch-depth 0)." >&2
            exit 1
          fi
          count=$(git rev-list --count "$HISTORY_SINCE..HEAD")
          echo "::notice title=History scan narrowed::The history scan starts after commit $HISTORY_SINCE and covers $count commits; the product's own scanner covers the history before it."
          gitleaks git . --redact --no-banner --ignore-gitleaks-allow --config "$RUNNER_TEMP/ci-cd-library/gitleaks.toml" --log-opts="$HISTORY_SINCE..HEAD"
      # The caller's own scripts/check_docs.py only: the library's copy checks
      # the tree it sits in (ROOT is its own parent folder), so it cannot check
      # a caller. A missing script fails the job unless require-repo-scripts is
      # false, which skips it with a log line.
      - name: Check documentation
        shell: bash
        env:
          REQUIRE_REPO_SCRIPTS: ${{ inputs.require-repo-scripts }}
        run: |
          if [ -f scripts/check_docs.py ]; then
            python3 scripts/check_docs.py
          elif [ "$REQUIRE_REPO_SCRIPTS" = true ]; then
            echo "scripts/check_docs.py is missing. Add it, or set require-repo-scripts: false to skip the docs check."
            exit 1
          else
            echo "No scripts/check_docs.py in this repository; docs check skipped."
          fi
      - name: Check sensitive paths
        shell: bash
        env:
          REQUIRE_REPO_SCRIPTS: ${{ inputs.require-repo-scripts }}
        run: |
          set -euo pipefail
          if [ -f scripts/sensitive-paths.sh ]; then
            git ls-files -z | bash scripts/sensitive-paths.sh
          elif [ "$REQUIRE_REPO_SCRIPTS" = true ]; then
            echo "scripts/sensitive-paths.sh is missing. Add it, or set require-repo-scripts: false to skip the sensitive-path check."
            exit 1
          else
            echo "No scripts/sensitive-paths.sh in this repository; sensitive-path check skipped."
          fi
      # has_pages comes with the repository's metadata, which this token can
      # always read; any answer but false or an allowed true fails the step.
      - name: Check GitHub Pages is off
        if: inputs.pages-check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TELEMETRY: "false"
          REPO: ${{ github.repository }}
          PAGES_ALLOWED: ${{ inputs.pages-allowed }}
        run: |
          set -euo pipefail
          pages=$(gh api "repos/$REPO" --jq .has_pages)
          if [ "$pages" = false ]; then exit 0; fi
          if [ "$pages" = true ] && [ "$PAGES_ALLOWED" = true ]; then exit 0; fi
          echo "GitHub Pages is on for $REPO (has_pages: $pages), and on a private repository its site is public. If it had its own custom domain, first delete the DNS records of that name, with and without www., that point at GitHub (keep the verification TXT record) and wait out their TTL. Then turn it off: Pages source None in Settings, or gh api -X DELETE repos/$REPO/pages. Only the owner sets pages-allowed, with a docs/DECISIONS.md entry."
          exit 1
      - name: Set up Python
        if: inputs.python-version != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up Node
        if: inputs.node-version != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache }}
      # The runner's own rustup, with plain commands rather than one more
      # action.
      - name: Install the Rust toolchain
        if: inputs.rust-toolchain != ''
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        run: |
          set -euo pipefail
          if [[ ! "$RUST_TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "rust-toolchain must be an exact Rust version X.Y.Z, e.g. 1.85.0; a channel, a short version or any other value is refused." >&2
            exit 1
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
      # After the secret scans, so restored files are never in what they scan.
      - name: Cache cargo
        if: inputs.cargo-dir != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.cargo-dir }}/target
          key: cargo-${{ runner.os }}-${{ inputs.rust-toolchain }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.cargo-dir)) }}
      - name: Run test command
        if: inputs.test-command != ''
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          # Library-named, never PG*: libpq and every Postgres tool read
          # those, so exporting them would change what the caller's own
          # commands connect to.
          CI_POSTGRES_USER: ${{ inputs.postgres-user }}
          CI_POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
          CI_POSTGRES_DB: ${{ inputs.postgres-db }}
        run: bash -euo pipefail -c "$TEST_COMMAND"
