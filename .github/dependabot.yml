# Keeps the pinned action SHAs current. CI runs on bot PRs with a read-only
# token and no secrets. They are never merged from the button: apply the
# bump locally, run `just ci`, and push it through the normal path. The
# cooldown holds a new release back for a week so a compromised version
# pulled within hours never reaches a PR;
# it applies to version updates only, never to security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /deploy/deployer
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /deploy/backup
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /deploy/restore-drill
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
